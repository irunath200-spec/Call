.sr .c4 .cd{min-height:78px;padding:8px 4px}.sr .c4 .cd span{font-size:11px}.sr .c4 .cd b{font-size:16px}

.mc h3{font-size:13px;margin:0 0 10px}.ib{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.ib span{display:block;font-size:12px;color:var(--mu)}.ib b{display:block;margin-top:4px;font-size:15px}.c22{display:grid;grid-template-columns:1fr 1fr;gap:8px}.br i.Normal{background:#16a34a}.br i.Risk{background:#f5a623}.br i.Critical{background:#dc2626}.tp{margin-top:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;text-align:center}.tp.Normal{background:#16a34a;color:#fff}.tp.Risk{background:#f5a623;color:#fff}.tp.Critical{background:#e11d48;color:#fff}
.zt td.r{font-weight:600}
</style></head><body>
<header><div><h1><i></i>ศูนย์ควบคุม SLA เดลิเวอรี่</h1><div class="mu" id="up">กำลังโหลดข้อมูล…</div></div><div class="sm" id="sm"></div></header>
<main>
<div class="pn"><div class="fl">
<div><label>โซน</label><select id="f_zone" onchange="fill()"></select></div>
<div><label>ฝ่าย</label><select id="f_div" onchange="fill()"></select></div>
<div><label>เขต</label><select id="f_wm" onchange="fill()"></select></div>
<div><label>FC</label><select id="f_fc" onchange="fill()"></select></div>

<div><label>รหัสสาขา</label><input id="f_st" placeholder="พิมพ์รหัสสาขา เช่น 34" onkeydown="if(event.key=='Enter')apply()"></div></div>
<div class="ac"><button class="pr" onclick="apply()">ใช้ตัวกรอง</button><button onclick="reset()">รีเซ็ต</button><button onclick="load()">รีเฟรชข้อมูล</button><span class="mu" style="margin-left:auto">จำนวนสาขาที่เลือก <b id="cnt" style="color:var(--cy)">0</b> สาขา</span></div></div>

<div id="zt"></div>
<div class="pn" id="m2"></div>
<div id="sect"></div>
<div class="pn"><h2>TC / SLA รายชั่วโมง</h2><div class="sc"><div id="hr" style="min-width:720px"></div></div></div>
<div class="g3"><div class="pn"><h2>เวลาแต่ละขั้นตอน (Process Breakdown) และส่งทันเวลา (Capacity Utilization)</h2><div class="rg2"><div id="dn"></div><div id="cap"></div></div></div>
<div class="pn"><div class="rw"><h2>หาสาเหตุความล่าช้า (Heatmap)</h2><div class="mu">มุมมองเฉลี่ยตาม <select id="hm" style="width:auto" onchange="PG.hm=0;tables()"><option value="6">FC</option><option value="7">เขต</option><option value="8">ฝ่าย</option><option value="2">โซน</option></select></div></div><div class="sc" id="hmt"></div></div></div>
<div class="pn"><h2>💡 สรุปสำหรับผู้บริหาร</h2><div class="ins" id="ins"></div></div>
<div class="pn"><h2>รายละเอียดรายสาขา (เรียงจาก SLA ช้าสุด)</h2><div class="sc" id="dt"></div></div>
</main>
<script>
const URL_='https://axcudclbkzhtdnezhlbi.supabase.co',KEY='sb_publishable_we-LE76OhWvNwg2Gd25Ccg_-kpE3Rjq';
const $=i=>document.getElementById(i),LV=[['zone',2],['div',8],['wm',7],['fc',6]],STG=['รับ','จัด','รอส่ง','ส่ง'],TG=[1,9,15,20],COL=['#16a34a','#3b82f6','#f59e0b','#ef4444'];
let ALL=[],META={},CUR={R:[]},PG={hm:0,dt:0,zt:0,m2:0},ZV=2;
const sum=(a,i)=>a.reduce((s,r)=>s+(+r[i]||0),0);
const avg=(a,i)=>{const v=a.map(r=>r[i]).filter(x=>x!=null&&x!=='');return v.length?v.reduce((s,x)=>s+ +x,0)/v.length:null};
const rr=(a,n,d)=>{const x=avg(a,n),y=avg(a,d);return x==null||y==null||!y?null:x/y},pst=r=>{const t=String(r[75]??'').toLowerCase().replace(/[^a-z\u0e00-\u0e7f]/g,'');if(t)return /non|not|^np$|^n$|ไม่/.test(t)?'N':'P';return r[22]!=null&&r[22]>45?'N':'P'};
const rt=(a,n,d)=>{const x=avg(a,n),y=avg(a,d);return x==null||y==null||!y?null:x/y*100};
const f=(n,d=1)=>{d=Math.min(d,1);return n==null||isNaN(n)?'—':(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const cp=n=>n>=1e3?f(n/1e3,2)+'K':f(n,0),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stt=s=>s>45?'Critical':s>=43?'Risk':'Normal',STL={Normal:'ในเกณฑ์',Risk:'ใกล้เกณฑ์',Critical:'เกินเกณฑ์'},s3=(v,t)=>v==null?'Normal':v>t?'Critical':v>=t*.9?'Risk':'Normal',SC={Normal:'#15803d',Risk:'#b7791f',Critical:'#dc2626'};
async function load(){$('up').textContent='กำลังโหลดข้อมูล…';
 try{const r=await fetch(URL_+'/rest/v1/sla_data?id=eq.1&select=records,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
 if(!r.ok)throw new Error('HTTP '+r.status);const d=(await r.json())[0]||{};META=d.records||{};ALL=META.rows||[];
 $('up').textContent=ALL.length?`อัปเดตล่าสุด ${new Date(d.updated_at).toLocaleString('th-TH')} • ${ALL.length.toLocaleString()} สาขา`:'ยังไม่มีข้อมูล — อัปโหลดไฟล์ที่หน้า Admin';
 fill();apply();}catch(e){$('up').textContent='โหลดข้อมูลไม่สำเร็จ: '+e.message}}
function fill(){let rows=ALL;LV.forEach(([k,i])=>{const el=$('f_'+k),cur=el.value,v=[...new Set(rows.map(r=>r[i]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'th'));
 el.innerHTML='<option value="">ทั้งหมด</option>'+v.map(x=>`<option>${esc(x)}</option>`).join('');el.value=v.includes(cur)?cur:'';if(el.value)rows=rows.filter(r=>r[i]==el.value)})}
function reset(){['zone','div','wm','fc'].forEach(k=>$('f_'+k).value='');$('f_st').value='';$('f_stt').value='';fill();apply()}
function apply(){let R=ALL;LV.forEach(([k,i])=>{const v=$('f_'+k).value;if(v)R=R.filter(r=>r[i]==v)});
 const sv=$('f_stt').value;if(sv)R=R.filter(r=>pst(r)==sv);const q=$('f_st').value.trim();if(q)R=R.filter(r=>String(r[0])===q);PG={hm:0,dt:0,zt:0,m2:0};render(R)}
function ring(segs,ct){let c=0,C=2*Math.PI*60;return `<svg class="rg" viewBox="0 0 180 180" width="190"><circle cx="90" cy="90" r="60" fill="none" stroke="#d6e2f5" stroke-width="22"/>`+segs.map(s=>{const l=s.v/100*C,o=c/100*C;c+=s.v;return `<circle cx="90" cy="90" r="60" fill="none" stroke="${s.c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 90 90)"/>`}).join('')+`<text x="90" y="98" text-anchor="middle" fill="#14225a" font-size="24" font-weight="600">${ct}</text></svg>`}
const CT=(l,v,u,c)=>`<div class="cd ${c}">${l?`<span>${l}</span>`:''}<b class="m">${v}</b>${u?`<small>${u}</small>`:''}</div>`;
function dash(R){const n=R.length,a=i=>avg(R,i),pS=n==1?(a(15)==null?null:a(15)*100):rt(R,14,11),pC=n==1?(a(20)==null?null:a(20)*100):rt(R,19,16),s11=a(11),s14=a(14),l18=a(18),sla=a(22),sg=[23,24,25,26].map(i=>a(i)),taS=n==1?a(13):rr(R,11,12),taD=n==1?a(17):rr(R,14,16),
 c=fn=>R.filter(r=>r[22]!=null&&fn(r[22])).length,sp=v=>f(v/n*100,1)+'%',call=R.filter(r=>r[21]!=null&&r[21]!=='').length,
 ov=STG.map((s,i)=>R.filter(r=>r[23+i]!=null&&r[23+i]>TG[i]).length),o45=c(x=>x>45),
 tr=[[c(x=>x<45),'SLA < 45 นาที','t1','#15803d'],[c(x=>x>=45&&x<=60),'SLA 45–60 นาที','t2','#b7791f'],[c(x=>x>60&&x<120),'SLA 60–119 นาที','t3','#dc2626'],[c(x=>x>=120),'SLA 120 นาทีขึ้นไป','t4','#b91c1c']];
 return `<div class="pn"><h2>ข้อมูลยอดขาย</h2><div class="cg">${CT('Store Sales (BPSD)',f(s11,0),'','or')}${CT('TC_store (บิล)',f(a(12),0),'','or')}${CT('TA_Store (บาท)',f(taS,0),'','or')}${CT('Delivery Sales (BPSD)',f(s14,0),'','gn')}${CT('TC_Delivery (บิล)',f(a(16),0),'','gn')}${CT('TA_Delivery (บาท)',f(taD,0),'','gn')}</div><div class="pf">%Of Sale <b>${f(pS,1)}%</b> (ยอดเดลิเวอรี่ต่อยอดขาย)</div></div>
<div class="pn"><h2>ข้อมูล SLA เวลาจัดส่ง</h2><div class="sr">${CT('Average SLA Time',f(sla)+' นาที','','bl')}<div><h3>เวลาแยกตามกระบวนการ (นาที)</h3><div class="c4">${STG.map((s,i)=>CT(s+' เป้า≤'+TG[i]+' นาที',f(sg[i]),'','bl'+(sg[i]>TG[i]?' ovr':''))).join('')}</div></div></div><div class="sr">${CT('SLA เกิน 45 นาที (สาขา)',o45.toLocaleString(),sp(o45)+' ของสาขา','pk')}<div><h3>กระบวนการผิดปกติ (สาขา)</h3><div class="c4">${STG.map((s,i)=>CT(s+' เกินเป้า',ov[i].toLocaleString(),sp(ov[i]),'pk')).join('')}</div></div></div></div>
<div class="pn"><h2>ข้อมูลสูญเสีย</h2><div class="cg">${CT('%Cancel Order',f(pC,2)+'%','','or')}${CT('TC_Cancel (บิล)',f(a(19),1),'','or')}${CT('มูลค่าสูญเสีย (บาท)',f(l18,1),'','or')}${CT('Call จัดส่งล่าช้า',call.toLocaleString()+' Call','','gn')}</div></div>
<div class="pn"><h2>Tier SLA เวลาจัดส่ง</h2><div class="c4">${tr.map((t,k)=>`<div class="tw"><em style="color:${t[3]}">${t[1]}</em>${CT('',t[0].toLocaleString(),'สาขา • '+sp(t[0]),t[2])}<div class="tp ${['Normal','Critical','Critical','Critical'][k]}">${['ในเกณฑ์','เกินเกณฑ์','เกินเกณฑ์','เกินเกณฑ์'][k]}</div></div>`).join('')}</div></div>`}
function store(r,per){const c=stt(r[22]),cn=r[20]==null?null:r[20]*100,cs=s3(cn,1.5),ib=(l,v)=>`<div class="ib"><span>${l}</span><b>${esc(v||'—')}</b></div>`,
 tr=(l,a,b,d)=>`<tr><td>${l}</td><td class="m">${f(a,0)}</td><td class="m">${f(b,0)}</td><td class="m">${f(d,0)}</td></tr>`,
 rg=r[22]==null?'—':r[22]<45?'น้อยกว่า 45 นาที':r[22]<=60?'45–60 นาที':r[22]<120?'60–119 นาที':'120 นาทีขึ้นไป',mb=(l,v)=>`<div class="ib"><span>${l}</span><b class="m">${v}</b></div>`;
 return `<div class="pn" style="border-left:4px solid ${SC[c]}"><div class="rw"><div><div class="mu">ผลงาน SLA เดลิเวอรี่ · รายงานรายสาขา</div><h2 style="font-size:22px;margin:6px 0">สาขา ${r[0]} · ${esc(r[1])}</h2><div class="mu">ช่วงข้อมูล ${esc(per)}</div></div><span class="st ${c}">SLA ${STL[c]}</span></div>
