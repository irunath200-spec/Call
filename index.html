</style></head><body>
<header><div><h1><i></i>ศูนย์ควบคุม SLA เดลิเวอรี่</h1><div class="mu" id="up">กำลังโหลดข้อมูล…</div></div><div class="sm" id="sm"></div></header>

</main>
<script>
const URL_='https://axcudclbkzhtdnezhlbi.supabase.co',KEY='sb_publishable_we-LE76OhWvNwg2Gd25Ccg_-kpE3Rjq';
const $=i=>document.getElementById(i),LV=[['zone',2],['div',8],['wm',7],['fc',6]],STG=['รับ','จัด','รอส่ง','ส่ง'],TG=[1,9,15,20],COL=['#16a34a','#3b82f6','#f59e0b','#ef4444'];

 if(!r.ok)throw new Error('HTTP '+r.status);const d=(await r.json())[0]||{};META=d.records||{};ALL=META.rows||[];
 $('up').textContent=ALL.length?`อัปเดตล่าสุด ${new Date(d.updated_at).toLocaleString('th-TH')} • ${ALL.length.toLocaleString()} สาขา`:'ยังไม่มีข้อมูล — อัปโหลดไฟล์ที่หน้า Admin';

 if(!n){$('kp').innerHTML='';$('m2').innerHTML='<div class="mu" style="text-align:center;padding:20px">ไม่พบข้อมูลตามตัวกรองที่เลือก</div>';['zt','sect','hr','cap','dn','hmt','dt','ins','tcta','sm'].forEach(i=>$(i).innerHTML='');return}
 const sS=sum(R,11),sD=sum(R,14),tc=sum(R,12),sla=avg(R,22),can=avg(R,20),call=R.filter(r=>r[21]!=null&&r[21]!=='').length;

 const hs=[],tcs=[];let ok=0,tt=0;for(let h=0;h<24;h++){let t=0,s=0,c=0;R.forEach(r=>{const x=+r[51+h]||0,v=r[27+h];t+=x;if(v!=null){s+=v;c++;if(x>0){tt+=x;if(v<=45)ok+=x}}});tcs.push(t/n);hs.push(c?s/c:null)}

 $('tcta').innerHTML=`<div class="pn"><h2>TC / TA ร้านและเดลิเวอรี่</h2><div class="sg">${[['TC ร้าน (รวม)',f(tcS,0),'เฉลี่ย '+f(tcS/n,0)+' ต่อสาขา'],['TA ร้าน (เฉลี่ย)',f(avg(R,13),0),'ของสาขาที่เลือก'],['TC เดลิเวอรี่ (รวม)',f(tcD,0),'เฉลี่ย '+f(tcD/n,0)+' ต่อสาขา','var(--bl)'],['TA เดลิเวอรี่ (เฉลี่ย)',f(avg(R,17),0),'ของสาขาที่เลือก','var(--bl)']].map(k=>`<div class="k"><span class="mu">${k[0]}</span><b class="m" style="${k[3]?'color:'+k[3]:''}">${k[1]}</b><span class="mu">${k[2]}</span></div>`).join('')}</div>${Object.keys(zg).length>1?`<div class="c2"><div><h3>TC ร้าน เฉลี่ยต่อสาขา (แยกโซน มากไปน้อย)</h3>${bars(12,'var(--cy)')}</div><div><h3>TC เดลิเวอรี่ เฉลี่ยต่อสาขา (แยกโซน มากไปน้อย)</h3>${bars(16,'var(--bl)')}</div></div>`:''}</div>`;
 $('zt').innerHTML=n>1?zoneTable(R):'';
 const L=R.filter(r=>r[10]).sort((a,b)=>(b[22]||0)-(a[22]||0));$('m2').innerHTML=`<div class="rw"><div><h2 style="margin:0">ร้าน SLA เฉลี่ยเกิน 45 นาทีต่อเนื่อง 2 เดือน</h2></div><span class="st ${L.length?'bad':'ok'}">${L.length} ร้าน</span></div>`+(L.length?`<div class="sc"><table><tr><th>รหัสสาขา</th><th>ชื่อร้าน</th><th>FC</th><th>SLA เฉลี่ย</th></tr>${L.slice(0,10).map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[6])}</td><td class="m">${f(r[22])}</td></tr>`).join('')}</table></div>`:'<div class="mu" style="padding:10px 0">ไม่พบร้านที่ SLA เกิน 45 นาทีต่อเนื่อง 2 เดือนในตัวกรองนี้</div>');
 if(n==1){const r=R[0],c=stt(r[22]),pc=r[20]==null?null:r[20]*100;
  $('sect').innerHTML=`<div class="pn bn"><div class="rw"><div><div class="mu">ผลงาน SLA เดลิเวอรี่ • รายงานรายสาขา</div><h2 style="font-size:22px;margin:6px 0">สาขา ${r[0]} · ${esc(r[1])}</h2><div class="mu">ช่วงข้อมูล ${esc(per)}</div></div><span class="st ${c}">SLA ${c=='Normal'?'ปกติ':c=='Risk'?'เสี่ยง':'วิกฤต'}</span></div>
