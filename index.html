<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLA Delivery Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--p:#111a2e;--p2:#0e1526;--line:rgba(255,255,255,.08);--tx:#e7edf7;--mu:#8b98b8;--cy:#22d3ee;--am:#f5a623;--rd:#f4506a;--gr:#34d399;--bl:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt',sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.m{font-family:'IBM Plex Mono',monospace}.mu{color:var(--mu);font-size:12px}
header{padding:18px 20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:20px}h1 i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);margin-right:10px}
main{max-width:1200px;margin:0 auto;padding:16px 14px 50px}
.pn{background:linear-gradient(180deg,var(--p),var(--p2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.pn h2{font-size:14px;margin:0 0 12px}
.fl{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.fl label{display:block;font-size:11.5px;color:var(--mu);margin-bottom:4px}
select,input{width:100%;background:#0c1424;border:1px solid var(--line);color:var(--tx);padding:9px;border-radius:8px;font:inherit;font-size:13px}
.ac{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;font-size:13px;padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--tx)}button.pr{background:var(--cy);color:#04222b;border:0;font-weight:600}button:disabled{opacity:.35}
.kp{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}.k{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}.k b{display:block;font-size:20px;margin:6px 0 2px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.ti{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.ti div,.mc{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px}.ti b{display:block;font-size:14px;margin-top:3px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.br{height:6px;background:#0c1424;border-radius:4px;margin:8px 0 4px;overflow:hidden}.br i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#0c1424;color:var(--mu);text-align:left;padding:8px;font-weight:500}td{padding:8px;border-top:1px solid var(--line)}.sc{overflow-x:auto}
td.r{background:rgba(244,80,106,.18);color:#ffb3c0}td.g{background:rgba(52,211,153,.10)}
.st{padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600}.Normal,.ok{background:rgba(52,211,153,.18);color:var(--gr)}.Risk{background:rgba(245,166,35,.2);color:var(--am)}.Critical,.bad{background:rgba(244,80,106,.2);color:var(--rd)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--mu);gap:8px;flex-wrap:wrap}.pg button{padding:5px 10px}
.bn{border-left:4px solid var(--gr)}.rw{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}ul{margin:0;padding-left:18px;font-size:13px;line-height:1.9}
@media(max-width:1000px){.kp{grid-template-columns:repeat(4,1fr)}.g2,.g3{grid-template-columns:1fr}.sg,.ti{grid-template-columns:repeat(2,1fr)}.fl{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kp{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1><i></i>SLA DELIVERY COMMAND CENTER</h1><div class="mu" id="up">กำลังโหลดข้อมูล…</div></header>
<main>
<div class="pn"><div class="fl">
<div><label>Zone</label><select id="f_zone" onchange="fill()"></select></div>
<div><label>ฝ่าย</label><select id="f_div" onchange="fill()"></select></div>
<div><label>เขต</label><select id="f_wm" onchange="fill()"></select></div>
<div><label>FC</label><select id="f_fc" onchange="fill()"></select></div>
<div><label>Store ID</label><input id="f_st" placeholder="พิมพ์รหัสสาขา เช่น 34" onkeydown="if(event.key=='Enter')apply()"></div></div>
<div class="ac"><button class="pr" onclick="apply()">Apply Filter</button><button onclick="reset()">รีเซ็ต</button><button onclick="load()">รีเฟรชข้อมูล</button><span class="mu" style="margin-left:auto">จำนวนสาขาที่เลือก <b id="cnt" style="color:var(--cy)">0</b> สาขา</span></div></div>
<div class="kp" id="kp"></div>
<div class="pn" id="m2"></div>
<div id="sect"></div>
<div class="g2"><div class="pn"><h2>SLA vs TC รายชั่วโมง</h2><div id="hr"></div></div><div class="pn"><h2>Capacity Utilization</h2><div id="cap" style="text-align:center"></div></div></div>
<div class="g3"><div class="pn"><h2>Process Breakdown</h2><div id="dn" style="text-align:center"></div></div>
<div class="pn"><div class="rw"><h2>Root Cause Heatmap</h2><div class="mu">มุมมองเฉลี่ยตาม <select id="hm" style="width:auto" onchange="PG.hm=0;tables()"><option value="6">FC</option><option value="7">เขต</option><option value="8">ฝ่าย</option><option value="2">Zone</option></select></div></div><div class="sc" id="hmt"></div></div></div>
<div class="pn"><h2>💡 Executive Insights</h2><ul id="ins"></ul></div>
<div class="pn"><h2>FC Performance Detail</h2><div class="sc" id="dt"></div></div>
</main>
<script>
const URL_='https://axcudclbkzhtdnezhlbi.supabase.co',KEY='sb_publishable_we-LE76OhWvNwg2Gd25Ccg_-kpE3Rjq';
const $=i=>document.getElementById(i),LV=[['zone',2],['div',8],['wm',7],['fc',6]],STG=['รับ','จัด','รอส่ง','ส่ง'],TG=[1,9,15,20],COL=['#34d399','#60a5fa','#f5a623','#f4506a'];
let ALL=[],META={},CUR={R:[]},PG={hm:0,dt:0};
const sum=(a,i)=>a.reduce((s,r)=>s+(+r[i]||0),0);
const avg=(a,i)=>{const v=a.map(r=>r[i]).filter(x=>x!=null&&x!=='');return v.length?v.reduce((s,x)=>s+ +x,0)/v.length:null};
const f=(n,d=1)=>n==null||isNaN(n)?'—':(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cp=n=>n>=1e3?f(n/1e3,2)+'K':f(n,0),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stt=s=>s>45?'Critical':s>=43?'Risk':'Normal';
async function load(){$('up').textContent='กำลังโหลดข้อมูล…';
 try{const r=await fetch(URL_+'/rest/v1/sla_data?id=eq.1&select=records,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
 if(!r.ok)throw new Error('HTTP '+r.status);const d=(await r.json())[0]||{};META=d.records||{};ALL=META.rows||[];
 $('up').textContent=ALL.length?`อัปเดตล่าสุด ${new Date(d.updated_at).toLocaleString('th-TH')} • ${ALL.length.toLocaleString()} สาขา`:'ยังไม่มีข้อมูล — อัปโหลดไฟล์ที่หน้า Admin';
 fill();apply();}catch(e){$('up').textContent='โหลดข้อมูลไม่สำเร็จ: '+e.message}}
function fill(){let rows=ALL;LV.forEach(([k,i])=>{const el=$('f_'+k),cur=el.value,v=[...new Set(rows.map(r=>r[i]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'th'));
 el.innerHTML='<option value="">ทั้งหมด</option>'+v.map(x=>`<option>${esc(x)}</option>`).join('');el.value=v.includes(cur)?cur:'';if(el.value)rows=rows.filter(r=>r[i]==el.value)})}
function reset(){['zone','div','wm','fc'].forEach(k=>$('f_'+k).value='');$('f_st').value='';fill();apply()}
function apply(){let R=ALL;LV.forEach(([k,i])=>{const v=$('f_'+k).value;if(v)R=R.filter(r=>r[i]==v)});
 const q=$('f_st').value.trim();if(q)R=R.filter(r=>String(r[0])===q);PG={hm:0,dt:0};render(R)}
function ring(segs,ct){let c=0,C=2*Math.PI*60;return `<svg viewBox="0 0 180 180" width="190"><circle cx="90" cy="90" r="60" fill="none" stroke="#1b2740" stroke-width="22"/>`+segs.map(s=>{const l=s.v/100*C,o=c/100*C;c+=s.v;return `<circle cx="90" cy="90" r="60" fill="none" stroke="${s.c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 90 90)"/>`}).join('')+`<text x="90" y="98" text-anchor="middle" fill="#e7edf7" font-size="24" font-weight="600">${ct}</text></svg>`}
function render(R){CUR.R=R;const n=R.length;$('cnt').textContent=n.toLocaleString();
 if(!n){$('kp').innerHTML='';$('m2').innerHTML='<div class="mu" style="text-align:center;padding:20px">ไม่พบข้อมูลตามตัวกรองที่เลือก</div>';['sect','hr','cap','dn','hmt','dt','ins'].forEach(i=>$(i).innerHTML='');return}
 const sS=sum(R,11),sD=sum(R,14),tc=sum(R,12),sla=avg(R,22),can=avg(R,20),call=R.filter(r=>r[21]!=null&&r[21]!=='').length;
 const sg=[23,24,25,26].map(i=>avg(R,i)),per=META.period||'ไม่ระบุวันที่',mx=sg.indexOf(Math.max(...sg.map(x=>x||0)));
 const hs=[],tcs=[];let ok=0,tt=0;for(let h=0;h<24;h++){let t=0,w=0,s=0;R.forEach(r=>{const x=+r[51+h]||0,v=r[27+h];t+=x;if(v!=null&&x>0){s+=v*x;w+=x;tt+=x;if(v<=45)ok+=x}});tcs.push(t);hs.push(w?s/w:null)}
 const cap=tt?ok/tt*100:null;
 $('kp').innerHTML=[['Total Sales',f(sS+sD,0)+' บาท','Store Sales + Delivery Sales'],['Store/Average',f(sS/n,0)+' บาท','เฉลี่ยจาก '+n.toLocaleString()+' ร้าน'],['Delivery Sales /Average',f(sD/n,0)+' บาท','เฉลี่ยจาก '+n.toLocaleString()+' ร้าน','var(--bl)'],['Average SLA Time',f(sla)+' นาที',''],['Cancel Rate',f(can==null?null:can*100,2)+'%',''],['Capacity Utilization',f(cap)+'%','Within SLA 45 min','var(--gr)'],['Call · จัดส่งล่าช้า',call||'—','จำนวนตาม Filter ที่เลือก']].map(k=>`<div class="k"><span class="mu">${k[0]}</span><b class="m" style="${k[3]?'color:'+k[3]:''}">${k[1]}</b><span class="mu">${k[2]}</span></div>`).join('');
 const L=R.filter(r=>r[10]);$('m2').innerHTML=`<div class="rw"><div><h2 style="margin:0">ร้าน SLA เฉลี่ยเกิน 45 นาทีต่อเนื่อง 2 เดือน</h2></div><span class="st ${L.length?'bad':'ok'}">${L.length} ร้าน</span></div>`+(L.length?`<div class="sc"><table><tr><th>Store ID</th><th>ชื่อร้าน</th><th>FC</th><th>SLA เฉลี่ย</th></tr>${L.slice(0,10).map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[6])}</td><td class="m">${f(r[22])}</td></tr>`).join('')}</table></div>`:'<div class="mu" style="padding:10px 0">ไม่พบร้านที่ SLA เกิน 45 นาทีต่อเนื่อง 2 เดือนในตัวกรองนี้</div>');
 if(n==1){const r=R[0],c=stt(r[22]),pc=r[20]==null?null:r[20]*100;
  $('sect').innerHTML=`<div class="pn bn"><div class="rw"><div><div class="mu">SLA PERFORMANCE DELIVERY • รายงานตามร้าน</div><h2 style="font-size:22px;margin:6px 0">Store ID ${r[0]} · ${esc(r[1])}</h2><div class="mu">ช่วงข้อมูล ${esc(per)}</div></div><span class="st ${c}">SLA ${c=='Normal'?'ปกติ':c=='Risk'?'เสี่ยง':'วิกฤต'}</span></div>
  <div class="ti"><div><span class="mu">Zone</span><b>${esc(r[2])}</b></div><div><span class="mu">Type</span><b>${esc(r[3])}</b></div><div><span class="mu">Profile</span><b>${esc(r[4])}</b></div><div><span class="mu">Sub-profile</span><b>${esc(r[5])}</b></div></div>
  <div class="g2" style="grid-template-columns:1.3fr 1fr"><div class="mc"><h2>ยอดขายและจำนวนรายการ</h2><table><tr><th>ข้อมูล</th><th>BPSD (บาท)</th><th>TC SUM</th><th>TA AVG</th></tr><tr><td>Store</td><td class="m">${f(r[11],0)}</td><td class="m">${f(r[12],0)}</td><td class="m">${f(r[13],0)}</td></tr><tr><td>Delivery</td><td class="m">${f(r[14],0)}</td><td class="m">${f(r[16],0)}</td><td class="m">${f(r[17],0)}</td></tr></table>
  <div class="sg" style="margin-top:10px;grid-template-columns:repeat(3,1fr)"><div class="ti" style="display:block;margin:0"><span class="mu">%Of Sales AVG</span><b>${f(r[15]==null?null:r[15]*100,2)}%</b></div><div class="ti" style="display:block;margin:0"><span class="mu">Call · จัดส่งล่าช้า</span><b>${esc(r[21]||'—')}</b></div><div class="ti" style="display:block;margin:0"><span class="mu">Total Sales</span><b>${f(r[11]+r[14],0)}</b></div></div></div>
  <div class="mc"><h2>ยกเลิกและช่วง SLA</h2><div class="ti" style="grid-template-columns:1fr 1fr;margin:0"><div><span class="mu">%Cancel AVG · เป้า ≤ 1.5%</span><b>${f(pc,2)}%</b></div><div><span class="mu">สูญเสีย (บาท) · Cancel_BPSD</span><b>${f(r[18],0)}</b></div><div><span class="mu">TC ยกเลิก · Cancel_TC</span><b>${f(r[19],1)}</b></div><div><span class="mu">ช่วง SLA</span><b>${r[22]==null?'—':r[22]<45?'น้อยกว่า 45 นาที':r[22]<=60?'45–60 นาที':'มากกว่า 60 นาที'}</b></div></div></div></div>
  <div class="mc" style="margin-top:12px"><div class="rw"><h2>SLA และเวลาเฉลี่ยแต่ละขั้นตอน</h2><b class="${r[22]>45?'bad':'ok'}" style="background:none">SLA ${f(r[22])} นาที · ${r[22]>45?'ผิดปกติ':'ปกติ'}</b></div><div class="sg">${STG.map((s,i)=>{const v=r[23+i],g=v!=null&&v<=TG[i];return `<div class="ti" style="display:block;margin:0"><span class="mu">${s} · เป้า ≤ ${TG[i]} นาที</span><b>${f(v)} นาที</b><div class="br"><i style="width:${Math.min(100,(v||0)/TG[i]*100)}%;background:${g?'var(--gr)':'var(--rd)'}"></i></div><span class="mu">${g?'ปกติ':'ผิดปกติ'}</span></div>`}).join('')}</div></div></div>`}
 else $('sect').innerHTML=`<div class="pn bn" style="border-left-color:${sla>45?'var(--rd)':'var(--gr)'}"><h2 style="font-size:17px;color:${sla>45?'var(--rd)':'var(--gr)'}">สถานะ SLA ภาพรวม: ${sla>45?'ผิดปกติ':'ปกติ'}</h2><div class="mu" style="font-size:13px">Store: ${n.toLocaleString()} ร้าน • ช่วงเวลา: ${esc(per)} • TC: ${cp(tc)} • SLA: ${f(sla)} นาที • สาเหตุปัญหาที่ควรตรวจสอบ: ขั้นตอน${STG[mx]}ใช้เวลาสูงสุดเฉลี่ย ${f(sg[mx])} นาที (จุดที่ควรตรวจสอบ)</div></div>`;
 const W=720,H=230,Lm=8,B=24,bw=(W-Lm-8)/24,mt=Math.max(...tcs,1),ms=Math.max(...hs.map(v=>v||0),50),yt=v=>H-B-v/mt*(H-B-14),ys=v=>H-B-v/ms*(H-B-14);
 $('hr').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="0" x2="${W}" y1="${ys(45)}" y2="${ys(45)}" stroke="#f4506a" stroke-dasharray="4 4" opacity=".6"/>`+tcs.map((v,h)=>`<rect x="${Lm+h*bw+3}" y="${yt(v)}" width="${bw-6}" height="${H-B-yt(v)}" fill="#22d3ee" opacity=".35"/><text x="${Lm+h*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8b98b8">${h}</text>`).join('')+`<polyline fill="none" stroke="#f5a623" stroke-width="2.5" points="${hs.map((v,h)=>v==null?'':`${Lm+h*bw+bw/2},${ys(v)}`).filter(Boolean).join(' ')}"/></svg><div class="mu">แท่ง = TC รวมรายชั่วโมง (สูงสุด ${cp(mt)}) · เส้นส้ม = SLA เฉลี่ยถ่วงน้ำหนัก TC (สูงสุด ${f(Math.max(...hs.map(v=>v||0)))} นาที) · เส้นแดง = 45 นาที</div>`;
 $('cap').innerHTML=ring([{v:cap||0,c:'#34d399'}],f(cap)+'%')+'<div style="color:var(--gr);font-size:13px">Within SLA 45 min</div>';
 const t=sg.reduce((s,x)=>s+(x||0),0)||1;$('dn').innerHTML=ring(sg.map((v,i)=>({v:(v||0)/t*100,c:COL[i]})),f(sla))+`<div class="mu" style="margin-top:6px">${STG.map((s,i)=>`<span style="color:${COL[i]}">●</span> ${s} ${f((sg[i]||0)/t*100)}%`).join(' &nbsp; ')}</div>`;
 const fg={};R.forEach(r=>(fg[r[6]]=fg[r[6]]||[]).push(r));const fa=Object.values(fg).map(a=>avg(a,22)).filter(v=>v!=null),ok2=R.filter(r=>r[22]!=null&&r[22]<=45).length,ws=R.filter(r=>r[22]!=null).length;
 $('ins').innerHTML=[`SLA เฉลี่ย ${f(sla)} นาที ${sla>45?'เกินเกณฑ์':'อยู่ในเกณฑ์'} 45 นาที; ${ok2.toLocaleString()} จาก ${ws.toLocaleString()} ร้าน (${f(ws?ok2/ws*100:null)}%) มี SLA ไม่เกิน 45 นาที`,`TC รวม ${cp(tc)} จาก ${n.toLocaleString()} แถวข้อมูลในฟิลเตอร์นี้`,`FC ที่มีข้อมูล SLA ทั้ง ${fa.length} แห่ง มี ${fa.filter(v=>v<=45).length} แห่งที่ค่าเฉลี่ยไม่เกิน 45 นาที`,`เวลารายขั้นตอน: ขั้นตอน${STG[mx]}ใช้เวลาสูงสุดเฉลี่ย ${f(sg[mx])} นาที (จุดที่ควรตรวจสอบ)`,`ยอดขาย Delivery คิดเป็น ${f(sD/(sS+sD)*100,2)}% ของ Total Sales (Store Sales + Delivery Sales)`].map(x=>`<li>${x}</li>`).join('');
 tables()}
function pager(k,t,sz){const p=PG[k],pages=Math.max(1,Math.ceil(t/sz));return `<div class="pg"><span>แสดง ${t?p*sz+1:0}–${Math.min(t,(p+1)*sz)} จาก ${t.toLocaleString()} รายการ</span><span><button ${p<1?'disabled':''} onclick="go('${k}',-1)">ก่อนหน้า</button> หน้า ${p+1} / ${pages} <button ${p>=pages-1?'disabled':''} onclick="go('${k}',1)">ถัดไป</button></span></div>`}
function go(k,d){PG[k]+=d;tables()}
function tables(){const R=CUR.R;if(!R.length)return;const ix=+$('hm').value,g={};R.forEach(r=>(g[r[ix]||'-']=g[r[ix]||'-']||[]).push(r));
